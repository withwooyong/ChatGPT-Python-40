<!DOCTYPE html>
<html>
  <head>
    <title>오류 - MBTI 성격유형검사</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }
      .error {
        color: red;
        font-size: 18px;
      }
      .back-btn {
        margin-top: 20px;
      }
      .back-btn a {
        background-color: #007bff;
        color: white;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <h1>오류가 발생했습니다</h1>
    <p class="error">{{ message }}</p>
    <div class="back-btn">
      <a href="/">다시 검사하기</a>
    </div>
  </body>
</html>
